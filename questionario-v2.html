<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Grecia 2026 · Travel Match</title><style>:root{--bg:#f7f8fc;--card:#fff;--text:#171821;--muted:#737785;--line:#e7e9ef;--a:#5b5ce2;--b:#8a63e8}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--text);background:radial-gradient(circle at 10% 10%,rgba(91,92,226,.11),transparent 30%),radial-gradient(circle at 90% 15%,rgba(138,99,232,.10),transparent 32%),var(--bg)}.wrap{max-width:760px;margin:auto;padding:16px 14px 40px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.brand{font-weight:800}.count{font-size:12px;color:var(--muted);background:#fff;border:1px solid var(--line);padding:7px 10px;border-radius:999px}.bar{height:8px;background:#e9eaf0;border-radius:999px;overflow:hidden;margin-bottom:18px}.fill{height:100%;width:0;background:linear-gradient(90deg,var(--a),var(--b));transition:.2s}.card{background:rgba(255,255,255,.97);border-radius:24px;padding:24px;box-shadow:0 18px 50px rgba(30,33,50,.10)}.k{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--a);font-weight:800}h1{font-size:34px;line-height:1.08;margin:10px 0 12px}h2{font-size:25px;line-height:1.18;margin:8px 0 8px}p{color:var(--muted);line-height:1.5}.chips{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}.chip{background:#f0efff;color:#4f48b6;padding:8px 11px;border-radius:999px;font-size:13px}.opts{display:grid;gap:10px;margin-top:18px}.opt{display:flex;gap:12px;align-items:center;border:1px solid var(--line);background:#fff;border-radius:16px;padding:14px 15px}.opt.sel{border-color:var(--a);box-shadow:0 0 0 3px rgba(91,92,226,.10);background:#fbfbff}.dot{width:20px;height:20px;border-radius:50%;border:2px solid #b8bcc8;display:grid;place-items:center;flex:0 0 20px}.sel .dot{border-color:var(--a)}.sel .dot:after{content:"";width:9px;height:9px;border-radius:50%;background:var(--a)}.sq{border-radius:6px}.sel .sq:after{content:"✓";width:auto;height:auto;background:none;color:var(--a);font-weight:900}.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:18px}.scale button{padding:14px 0;border:1px solid var(--line);background:#fff;border-radius:14px;font-weight:800}.scale button.on{background:var(--a);color:#fff;border-color:var(--a)}.labels{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:8px}input,textarea{width:100%;border:1px solid var(--line);border-radius:16px;padding:14px;font:inherit;outline:none;margin-top:18px;background:#fff}textarea{min-height:120px;resize:vertical}.nav{display:flex;gap:10px;margin-top:18px}.btn{border:0;border-radius:15px;padding:14px 18px;font-weight:800;font-size:15px}.primary{background:linear-gradient(90deg,var(--a),var(--b));color:#fff;flex:1}.secondary{background:#fff;border:1px solid var(--line)}.btn:disabled{opacity:.45}.small{font-size:13px}pre{white-space:pre-wrap;background:#15171d;color:#eef0f6;padding:14px;border-radius:16px;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;max-height:300px;overflow:auto}@media(max-width:600px){.card{padding:20px;border-radius:20px}h1{font-size:30px}h2{font-size:22px}}</style></head><body><div class="wrap"><div class="top"><div class="brand">Travel Match · Grecia</div><div class="count" id="count">Benvenuto</div></div><div class="bar"><div class="fill" id="fill"></div></div><div id="app"></div></div><script>(function(){var Q=[{id:'name',s:'Profilo',q:'Come ti chiami?',t:'text',p:'Nome o soprannome'},{id:'duration',s:'Periodo',q:'Quanto dovrebbe durare il viaggio?',t:'single',o:['7 giorni','8 giorni','9 giorni','10 giorni','Più di 10 giorni','Sono flessibile']},{id:'period',s:'Periodo',q:'Quale parte di settembre preferisci?',t:'single',o:['Inizio settembre','Prima metà','Metà settembre','Seconda metà','Fine settembre','Indifferente']},{id:'flex',s:'Periodo',q:'Quanto sei flessibile sulle date?',t:'single',o:['Per niente','± 1-2 giorni','± 3-4 giorni','Molto flessibile','Qualsiasi settimana di settembre']},{id:'budget',s:'Budget',q:'Quanto vorresti spendere a persona?',n:'Voli, alloggio e spostamenti principali.',t:'single',o:['Fino a 800 €','800–1.000 €','1.000–1.200 €','1.200–1.500 €','1.500–2.000 €','Oltre 2.000 € se ne vale la pena','Non voglio fissarlo ora']},{id:'saving',s:'Budget',q:'Quanto conta risparmiare?',t:'scale',lo:'Poco',hi:'Moltissimo'},{id:'premium',s:'Budget',q:'Per una meta davvero speciale spenderesti di più?',t:'single',o:['Sì','Probabilmente sì','Dipende da quanto vale','Preferirei di no','No']},{id:'sea',s:'Stile',q:'Quanto conta il mare?',t:'scale',lo:'Secondario',hi:'Fondamentale'},{id:'land',s:'Stile',q:'Quanto contano paesaggi e tramonti?',t:'scale',lo:'Poco',hi:'Fondamentale'},{id:'food',s:'Stile',q:'Quanto conta mangiare bene?',t:'scale',lo:'Poco',hi:'Fondamentale'},{id:'culture',s:'Stile',q:'Quanto contano cultura, borghi e siti archeologici?',t:'scale',lo:'Poco',hi:'Fondamentale'},{id:'night',s:'Stile',q:'Quanto conta la vita serale?',t:'scale',lo:'Poco',hi:'Fondamentale'},{id:'relax',s:'Stile',q:'Quanto conta il relax?',t:'scale',lo:'Poco',hi:'Fondamentale'},{id:'beach',s:'Mare',q:'Che tipo di spiagge preferisci?',t:'multi',o:['Sabbia chiara','Calette','Spiagge selvagge','Scogli e acqua trasparente','Beach club','Lunghe spiagge comode','Mi interessa soprattutto che il mare sia bellissimo']},{id:'pace',s:'Ritmo',q:'Qual è il ritmo ideale?',t:'single',o:['Hotel, mare, cena e relax','Relax con qualche escursione','50% relax / 50% esplorazione','Mi piace vedere molte cose','Voglio sfruttare ogni giornata']},{id:'changes',s:'Ritmo',q:'Quante volte cambieresti hotel?',t:'single',o:['Mai','Una volta','Due volte','Anche più volte se ne vale la pena']},{id:'islands',s:'Spostamenti',q:'Quante isole preferiresti fare?',t:'single',o:['Una sola','Due','Tre','Più mete possibili','Nessuna preferenza']},{id:'ferries',s:'Spostamenti',q:'Quanto ti pesano i traghetti?',t:'scale',lo:'Per nulla',hi:'Molto'},{id:'mobility',s:'Spostamenti',q:'Cosa saresti disposto a noleggiare?',t:'multi',o:['Auto','Scooter','Quad','Tutti','Nessuno']},{id:'hotel',s:'Alloggio',q:'Che tipo di sistemazione preferisci?',t:'multi',o:['Hotel semplice ma ottimo','Hotel 3 stelle','Hotel 4 stelle','Boutique hotel','Appartamento','Resort','Dipende dalla destinazione']},{id:'seaview',s:'Alloggio',q:'Quanto conta una bella vista o vista mare?',t:'scale',lo:'Poco',hi:'Molto'},{id:'evening',s:'Serate',q:'La sera cosa ti piacerebbe fare?',t:'multi',o:['Cena tranquilla','Passeggiata','Cocktail bar','Locali con musica','Beach club','Discoteca','Serata romantica','Dipende dalla giornata']},{id:'santorini',s:'Icone',q:'Quanto ti interessa Santorini?',t:'single',o:['È praticamente obbligatoria','Mi interessa molto','Mi piacerebbe','Solo se si inserisce bene','Non mi interessa particolarmente']},{id:'mykonos',s:'Icone',q:'Quanto ti interessa Mykonos?',t:'single',o:['È praticamente obbligatoria','Mi interessa molto','Mi piacerebbe','Solo se si inserisce bene','Non mi interessa particolarmente']},{id:'premiumchoice',s:'Icone',q:'Se Santorini o Mykonos alzassero molto il costo totale?',t:'single',o:['Le terrei comunque','Farei solo 1-2 notti','Ne sceglierei una sola','Le sostituirei con isole più convenienti','Deciderei dopo aver visto i costi']},{id:'top',s:'Priorità',q:'Scegli fino a 5 cose davvero importanti.',t:'multi',m:5,o:['Mare spettacolare','Spiagge belle','Hotel bello','Buon cibo','Vita serale','Paesi caratteristici','Tramonti','Relax','Escursioni','Cultura','Pochi spostamenti','Prezzo conveniente','Destinazioni iconiche','Posti poco turistici','Esperienze romantiche','Divertimento']},{id:'avoid',s:'Priorità',q:'Cosa vorresti evitare?',t:'multi',o:['Troppa confusione','Turismo di massa','Prezzi esagerati','Hotel scadenti','Troppi traghetti','Troppi cambi hotel','Lunghi spostamenti','Località morte la sera','Discoteche e caos','Spiagge troppo affollate','Mete troppo isolate']},{id:'perfect',s:'Finale',q:'Per dire «è stata una vacanza fantastica», quali 3 cose devono esserci?',t:'textarea',p:'Scrivi liberamente le tre cose più importanti…'},{id:'winner',s:'Finale',q:'Se dovessi scegliere una sola priorità, quale vincerebbe?',t:'single',o:['Mare più bello possibile','Vacanza più romantica','Più cose da vedere','Miglior rapporto qualità/prezzo','Più divertimento','Più relax','Posti iconici','Viaggio più semplice e comodo','Equilibrio tra tutto']}];var S={step:-1,a:{}};try{var r=localStorage.getItem('travelMatchV2');if(r)S=JSON.parse(r)}catch(e){}function save(){try{localStorage.setItem('travelMatchV2',JSON.stringify(S))}catch(e){}}function esc(x){return String(x==null?'':x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}function valid(q){var a=S.a[q.id];return q.t==='multi'?(Array.isArray(a)&&a.length>0):(a!==undefined&&a!==null&&String(a).trim()!=='')}function welcome(){document.getElementById('fill').style.width='0%';document.getElementById('count').innerHTML='Benvenuto';document.getElementById('app').innerHTML='<div class="card"><div class="k">Grecia · Settembre 2026</div><h1>Troviamo il viaggio giusto per voi.</h1><p>Rispondi pensando alla tua vacanza ideale. Poi confronteremo le risposte e costruiremo le proposte migliori.</p><div class="chips"><span class="chip">3–5 minuti</span><span class="chip">Mobile friendly</span><span class="chip">Una domanda alla volta</span></div><button class="btn primary" id="start">Inizia il questionario</button><p class="small">Le risposte restano sul dispositivo finché non decidi di copiarle.</p></div>';document.getElementById('start').onclick=function(){S.step=0;render()}}function render(){save();if(S.step<0){welcome();return}if(S.step>=Q.length){finish();return}var q=Q[S.step],a=S.a[q.id],h='<div class="card"><div class="k">'+esc(q.s)+'</div><h2>'+esc(q.q)+'</h2>';if(q.n)h+='<p>'+esc(q.n)+'</p>';if(q.t==='single'){h+='<div class="opts">';for(var i=0;i<q.o.length;i++)h+='<div class="opt '+(a===q.o[i]?'sel':'')+'" data-o="'+i+'"><span class="dot"></span><span>'+esc(q.o[i])+'</span></div>';h+='</div>'}else if(q.t==='multi'){var arr=Array.isArray(a)?a:[];h+='<div class="opts">';for(var j=0;j<q.o.length;j++)h+='<div class="opt '+(arr.indexOf(q.o[j])>=0?'sel':'')+'" data-m="'+j+'"><span class="dot sq"></span><span>'+esc(q.o[j])+'</span></div>';h+='</div>';if(q.m)h+='<p class="small">Massimo '+q.m+' opzioni.</p>'}else if(q.t==='scale'){h+='<div class="scale">';for(var n=1;n<=5;n++)h+='<button data-s="'+n+'" class="'+(a===n?'on':'')+'">'+n+'</button>';h+='</div><div class="labels"><span>'+esc(q.lo)+'</span><span>'+esc(q.hi)+'</span></div>'}else if(q.t==='text')h+='<input id="txt" value="'+esc(a||'')+'" placeholder="'+esc(q.p||'')+'">';else h+='<textarea id="txt" placeholder="'+esc(q.p||'')+'">'+esc(a||'')+'</textarea>';h+='<div class="nav"><button class="btn secondary" id="back">Indietro</button><button class="btn primary" id="next" '+(valid(q)?'':'disabled')+'>Continua</button></div></div>';document.getElementById('app').innerHTML=h;document.getElementById('count').innerHTML=(S.step+1)+' / '+Q.length;document.getElementById('fill').style.width=Math.round(S.step/Q.length*100)+'%';document.getElementById('back').onclick=function(){S.step=Math.max(-1,S.step-1);render()};document.getElementById('next').onclick=function(){if(valid(q)){S.step++;render();scrollTo(0,0)}};var os=document.querySelectorAll('[data-o]');for(var x=0;x<os.length;x++)os[x].onclick=function(){S.a[q.id]=q.o[parseInt(this.getAttribute('data-o'))];render()};var ms=document.querySelectorAll('[data-m]');for(var y=0;y<ms.length;y++)ms[y].onclick=function(){var v=q.o[parseInt(this.getAttribute('data-m'))],ar=Array.isArray(S.a[q.id])?S.a[q.id].slice():[],ix=ar.indexOf(v);if(ix>=0)ar.splice(ix,1);else{if(q.m&&ar.length>=q.m){alert('Massimo '+q.m+' opzioni.');return}ar.push(v)}S.a[q.id]=ar;render()};var ss=document.querySelectorAll('[data-s]');for(var z=0;z<ss.length;z++)ss[z].onclick=function(){S.a[q.id]=parseInt(this.getAttribute('data-s'));render()};var t=document.getElementById('txt');if(t)t.oninput=function(){S.a[q.id]=this.value;save();document.getElementById('next').disabled=!valid(q)}}function summary(){var o=['RISPOSTE VIAGGIO GRECIA — '+(S.a.name||'Partecipante'),''];for(var i=0;i<Q.length;i++){var a=S.a[Q[i].id];if(a!==undefined){o.push(Q[i].q);o.push(Array.isArray(a)?a.join(', '):String(a));o.push('')}}return o.join('\n')}function finish(){document.getElementById('fill').style.width='100%';document.getElementById('count').innerHTML='Completato';document.getElementById('app').innerHTML='<div class="card"><div class="k">Completato</div><h1>Perfetto. Risposte pronte.</h1><p>Copiale e mandamele: le confronteremo con quelle dell’altra persona per costruire le mete migliori.</p><div class="nav"><button class="btn primary" id="copy">Copia risposte</button><button class="btn secondary" id="reset">Ricomincia</button></div><details><summary>Mostra riepilogo</summary><pre>'+esc(summary())+'</pre></details></div>';document.getElementById('copy').onclick=function(){var tx=summary();if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(tx).then(function(){alert('Risposte copiate.')});else{var ta=document.createElement('textarea');ta.value=tx;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);alert('Risposte copiate.')}};document.getElementById('reset').onclick=function(){if(confirm('Cancellare tutte le risposte?')){S={step:-1,a:{}};try{localStorage.removeItem('travelMatchV2')}catch(e){}render()}}}render()})();</script></body></html>
